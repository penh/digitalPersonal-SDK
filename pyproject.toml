[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dp4500"
version = "1.0.0"
authors = [
    { name = "Biometrics SDK Team" }
]
description = "Production-grade Python SDK for DigitalPersona (U.are.U) 4500 Fingerprint Readers"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["digitalpersona", "uareu", "fingerprint", "biometrics", "4500", "libfprint", "scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.scripts]
dp4500 = "dp4500.cli:main"

[project.urls]
"Homepage" = "https://github.com/example/dp4500"
